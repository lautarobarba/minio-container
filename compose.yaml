name: minio
services:
  minio:
    container_name: minio
    # MinIO dejó de publicar imágenes oficiales; pgsty/minio es un fork comunitario compatible
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":${MINIO_WEB_PORT}"
    restart: always
    env_file: .env
    ports:
      # server
      - ${MINIO_SERVER_PORT}:9000
      # web ui
      - ${MINIO_WEB_PORT}:${MINIO_WEB_PORT}
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 30s
      interval: 30s
      retries: 3
      timeout: 10s

  # Cliente S3 (aws-cli) usado por los scripts de backup y para restaurar.
  # No se inicia con "docker compose up", se usa con "docker compose run --rm backup ..."
  backup:
    image: amazon/aws-cli:latest
    profiles:
      - backup
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backups:/backups
      - ./restore:/restore
